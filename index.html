 <!DOCTYPE html>

<head>

  <link rel="stylesheet" href="frontend/styles.css">
</head>

<body>

  <!-- HEADER -->

    <button class="menu-btn" onclick="toggleSidebar()">

    <h2>Categories</h2>

    <a href="#" class="active" onclick="selectLink(this); return false;">

    <a href="#" onclick="selectLink(this); return false;">

    </a>

    <a href="#" onclick="selectLink(this); return false;">
      Biography
    </a>

    <a href="#" onclick="selectLink(this); return false;">
      Romance
    </a>

    <a href="#" onclick="selectLink(this); return false;">
      Mystery
    </a>

  </aside>


  <!-- MAIN CONTENT -->
  <main class="main-content">

    <h2 id="pageTitle">Fiction</h2>

    <p>Loading books...</p>

  </main>


  <!-- JAVASCRIPT -->
  <script src="frontend/js/homePage.js"></script>

</body>

</html>
