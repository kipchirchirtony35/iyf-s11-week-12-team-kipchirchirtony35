<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <h1>🌤 Weather App</h1>
  <p class="subtitle">Search any city or location worldwide</p>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="e.g. London, Tokyo, New York..." autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="loading" id="loading">Loading weather data...</div>
  <div class="error" id="error"></div>

  <div class="card" id="weatherCard">
    <div class="location" id="location"></div>
    <div class="country" id="country"></div>
    <div class="main-temp" id="temp"></div>
    <div class="condition" id="condition"></div>

    <div class="details">
      <div class="detail-item">
        <div class="detail-label">Feels like</div>
        <div class="detail-value" id="feelsLike"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Humidity</div>
        <div class="detail-value" id="humidity"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Wind</div>
        <div class="detail-value" id="wind"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Precipitation</div>
        <div class="detail-value" id="precip"></div>
      </div>
    </div>

    <div class="forecast">
      <div class="forecast-title">Next 5 days</div>
      <div class="forecast-days" id="forecast"></div>
    </div>
  </div>

  <footer>
    Data from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> • Free & open-source
  </footer>

  <script src="../components/weather.js"></script>
</body>
</html>
